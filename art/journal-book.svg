  <use xlink:href="#coverCorner" transform="translate(0,0)"/>
  <use xlink:href="#coverCorner" transform="translate(1500,0) scale(-1,1)"/>
  <use xlink:href="#coverCorner" transform="translate(0,1000) scale(1,-1)"/>
  <use xlink:href="#coverCorner" transform="translate(1500,1000) scale(-1,-1)"/>

  <!-- page edges (the stack of pages) -->
  <g fill="#e2d2a8" stroke="#a88a55" stroke-width="1">
    <rect x="72" y="62" width="676" height="892" rx="4"/>
    <rect x="752" y="62" width="676" height="892" rx="4"/>
    <rect x="76" y="58" width="672" height="892" rx="4"/>
    <rect x="752" y="58" width="672" height="892" rx="4"/>
  </g>

  <!-- pages -->
