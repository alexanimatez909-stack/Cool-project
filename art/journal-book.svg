  <use xlink:href="#fleuron" transform="translate(1086,878) scale(0.6)"/>

  <!-- ribbon bookmark -->
  <path d="M738,46 L762,46 L762,992 L750,976 L738,992 Z" fill="url(#ribbon)" stroke="#3a0708" stroke-width="1.5"/>
</svg>
