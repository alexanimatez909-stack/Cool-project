<html><head><style>@font-face{font-family:"Pinyon Script";src:url("PinyonScript-Regular.ttf");}
body{margin:0;background:transparent}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2048" height="336" viewBox="0 -40 1024 168">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6df9c"/>
      <stop offset="0.35" stop-color="#cfa24c"/>
      <stop offset="0.65" stop-color="#946524"/>
      <stop offset="1" stop-color="#553611"/>
    </linearGradient>
    <linearGradient id="brassSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4716"/>
      <stop offset="0.5" stop-color="#e2bb67"/>
      <stop offset="1" stop-color="#6b4716"/>
    </linearGradient>
    <linearGradient id="brassText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0bd"/>
      <stop offset="0.5" stop-color="#d9ad55"/>
      <stop offset="1" stop-color="#7a5219"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="0.45" stop-color="#cfa24c"/>
      <stop offset="1" stop-color="#553611"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-30%" width="110%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- a wire curl: dark outline under a brass line, so it reads as a metal rod -->
    <g id="endCurl" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M130,56 C130,38 120,24 104,22 C88,20 80,34 88,42 C94,48 103,44 101,37 C100,32 94,31 92,35" stroke="#2a1806" stroke-width="8"/>
      <path d="M130,56 C130,38 120,24 104,22 C88,20 80,34 88,42 C94,48 103,44 101,37 C100,32 94,31 92,35" stroke="url(#brassSide)" stroke-width="5"/>
      <path d="M126,48 C124,36 116,28 106,27" stroke="#fff1c2" stroke-width="0.8" opacity="0.6"/>
      <!-- a second, smaller curl tucked inside -->
      <path d="M122,58 C114,50 104,50 100,56 C97,61 103,64 106,60" stroke="#2a1806" stroke-width="5.5"/>
      <path d="M122,58 C114,50 104,50 100,56 C97,61 103,64 106,60" stroke="url(#brassSide)" stroke-width="3"/>
    </g>

    <g id="end" stroke-linejoin="round">
      <use xlink:href="#endCurl"/>
      <use xlink:href="#endCurl" transform="translate(0,128) scale(1,-1)"/>
      <!-- rounded leaf pointing outward, with a curl at its tip -->
      <path d="M124,64 C108,54 88,56 78,64 C88,72 108,74 124,64 Z" fill="url(#brass)" stroke="#2a1806" stroke-width="1.5"/>
      <path d="M120,64 C106,62 92,62 82,64" fill="none" stroke="#553611" stroke-width="1"/>
      <g fill="none" stroke-linecap="round">
        <path d="M80,64 C72,58 62,60 63,67 C64,72 71,72 71,67" stroke="#2a1806" stroke-width="5.5"/>
        <path d="M80,64 C72,58 62,60 63,67 C64,72 71,72 71,67" stroke="url(#brassSide)" stroke-width="3"/>
      </g>
      <!-- knot where the curls meet -->
      <circle cx="128" cy="64" r="7" fill="url(#ball)" stroke="#2a1806" stroke-width="1.5"/>
      <!-- collar with beads -->
      <rect x="134" y="40" width="14" height="48" rx="5" fill="url(#brassSide)" stroke="#2a1806" stroke-width="1.6"/>
      <line x1="141" y1="44" x2="141" y2="84" stroke="#553611" stroke-width="1"/>
      <circle cx="141" cy="37" r="3" fill="url(#ball)" stroke="#2a1806" stroke-width="1"/>
      <circle cx="141" cy="91" r="3" fill="url(#ball)" stroke="#2a1806" stroke-width="1"/>
    </g>

    <!-- small pair of metal curls sitting on the rim (top); mirrored for the bottom -->
    <g id="rimCurls" fill="none" stroke-linecap="round">
      <path d="M0,0 C-4,-10 -16,-13 -21,-6 C-24,-1 -18,3 -15,-1" stroke="#2a1806" stroke-width="5"/>
      <path d="M0,0 C-4,-10 -16,-13 -21,-6 C-24,-1 -18,3 -15,-1" stroke="url(#brassSide)" stroke-width="2.6"/>
      <path d="M0,0 C4,-10 16,-13 21,-6 C24,-1 18,3 15,-1" stroke="#2a1806" stroke-width="5"/>
      <path d="M0,0 C4,-10 16,-13 21,-6 C24,-1 18,3 15,-1" stroke="url(#brassSide)" stroke-width="2.6"/>
      <circle cx="0" cy="-2" r="2.6" fill="url(#ball)" stroke="#2a1806" stroke-width="0.8"/>
    </g>

    <!-- calligraphic pen flourish (one half) -->
    <g id="flourish" fill="none" stroke-linecap="round">
      <path d="M430,30 C412,20 392,28 400,34 C408,39 418,30 408,26 C396,22 372,34 340,36 C320,37 306,35 296,32" stroke="#2a1806" stroke-width="3.2"/>
      <path d="M430,30 C412,20 392,28 400,34 C408,39 418,30 408,26 C396,22 372,34 340,36 C320,37 306,35 296,32" stroke="url(#brassSide)" stroke-width="1.6"/>
    </g>
    <g id="flourishLow" fill="none" stroke-linecap="round">
      <path d="M500,89 C470,100 440,90 452,96 C462,101 474,92 462,88 C448,84 420,94 380,90 C350,87 330,89 312,92" stroke="#2a1806" stroke-width="3.2"/>
      <path d="M500,89 C470,100 440,90 452,96 C462,101 474,92 462,88 C448,84 420,94 380,90 C350,87 330,89 312,92" stroke="url(#brassSide)" stroke-width="1.6"/>
    </g>
  </defs>

  <g filter="url(#shadow)">
    <!-- the frame around the channel (evenodd leaves the channel see-through) -->
    <path fill-rule="evenodd" fill="url(#brass)" stroke="#2a1806" stroke-width="1.6"
      d="M152,44 H872 Q880,44 880,52 V76 Q880,84 872,84 H152 Q144,84 144,76 V52 Q144,44 152,44 Z
         M152,53 V75 H872 V53 Z"/>
    <line x1="150" y1="47.5" x2="874" y2="47.5" stroke="#553611" stroke-width="0.9" opacity="0.8"/>
    <line x1="150" y1="80.5" x2="874" y2="80.5" stroke="#553611" stroke-width="0.9" opacity="0.8"/>
    <g id="beads" fill="url(#ball)" stroke="#2a1806" stroke-width="0.7"><circle cx="160" cy="44" r="1.8"/><circle cx="160" cy="84" r="1.8"/><circle cx="172" cy="44" r="1.8"/><circle cx="172" cy="84" r="1.8"/><circle cx="184" cy="44" r="1.8"/><circle cx="184" cy="84" r="1.8"/><circle cx="196" cy="44" r="1.8"/><circle cx="196" cy="84" r="1.8"/><circle cx="208" cy="44" r="1.8"/><circle cx="208" cy="84" r="1.8"/><circle cx="268" cy="44" r="1.8"/><circle cx="268" cy="84" r="1.8"/><circle cx="280" cy="44" r="1.8"/><circle cx="280" cy="84" r="1.8"/><circle cx="292" cy="44" r="1.8"/><circle cx="292" cy="84" r="1.8"/><circle cx="304" cy="44" r="1.8"/><circle cx="304" cy="84" r="1.8"/><circle cx="316" cy="44" r="1.8"/><circle cx="316" cy="84" r="1.8"/><circle cx="328" cy="44" r="1.8"/><circle cx="328" cy="84" r="1.8"/><circle cx="340" cy="44" r="1.8"/><circle cx="340" cy="84" r="1.8"/><circle cx="352" cy="44" r="1.8"/><circle cx="352" cy="84" r="1.8"/><circle cx="364" cy="44" r="1.8"/><circle cx="364" cy="84" r="1.8"/><circle cx="376" cy="44" r="1.8"/><circle cx="376" cy="84" r="1.8"/><circle cx="388" cy="44" r="1.8"/><circle cx="388" cy="84" r="1.8"/><circle cx="400" cy="44" r="1.8"/><circle cx="400" cy="84" r="1.8"/><circle cx="412" cy="44" r="1.8"/><circle cx="412" cy="84" r="1.8"/><circle cx="424" cy="44" r="1.8"/><circle cx="424" cy="84" r="1.8"/><circle cx="436" cy="44" r="1.8"/><circle cx="436" cy="84" r="1.8"/><circle cx="448" cy="44" r="1.8"/><circle cx="448" cy="84" r="1.8"/><circle cx="460" cy="44" r="1.8"/><circle cx="460" cy="84" r="1.8"/><circle cx="472" cy="44" r="1.8"/><circle cx="472" cy="84" r="1.8"/><circle cx="484" cy="44" r="1.8"/><circle cx="484" cy="84" r="1.8"/><circle cx="496" cy="44" r="1.8"/><circle cx="508" cy="44" r="1.8"/><circle cx="520" cy="44" r="1.8"/><circle cx="532" cy="44" r="1.8"/><circle cx="544" cy="44" r="1.8"/><circle cx="544" cy="84" r="1.8"/><circle cx="556" cy="44" r="1.8"/><circle cx="556" cy="84" r="1.8"/><circle cx="568" cy="44" r="1.8"/><circle cx="568" cy="84" r="1.8"/><circle cx="580" cy="44" r="1.8"/><circle cx="580" cy="84" r="1.8"/><circle cx="592" cy="44" r="1.8"/><circle cx="592" cy="84" r="1.8"/><circle cx="604" cy="44" r="1.8"/><circle cx="604" cy="84" r="1.8"/><circle cx="616" cy="44" r="1.8"/><circle cx="616" cy="84" r="1.8"/><circle cx="628" cy="44" r="1.8"/><circle cx="628" cy="84" r="1.8"/><circle cx="640" cy="44" r="1.8"/><circle cx="640" cy="84" r="1.8"/><circle cx="652" cy="44" r="1.8"/><circle cx="652" cy="84" r="1.8"/><circle cx="664" cy="44" r="1.8"/><circle cx="664" cy="84" r="1.8"/><circle cx="676" cy="44" r="1.8"/><circle cx="676" cy="84" r="1.8"/><circle cx="688" cy="44" r="1.8"/><circle cx="688" cy="84" r="1.8"/><circle cx="700" cy="44" r="1.8"/><circle cx="700" cy="84" r="1.8"/><circle cx="712" cy="44" r="1.8"/><circle cx="712" cy="84" r="1.8"/><circle cx="724" cy="44" r="1.8"/><circle cx="724" cy="84" r="1.8"/><circle cx="736" cy="44" r="1.8"/><circle cx="736" cy="84" r="1.8"/><circle cx="748" cy="44" r="1.8"/><circle cx="748" cy="84" r="1.8"/><circle cx="760" cy="44" r="1.8"/><circle cx="760" cy="84" r="1.8"/><circle cx="820" cy="44" r="1.8"/><circle cx="820" cy="84" r="1.8"/><circle cx="832" cy="44" r="1.8"/><circle cx="832" cy="84" r="1.8"/><circle cx="844" cy="44" r="1.8"/><circle cx="844" cy="84" r="1.8"/><circle cx="856" cy="44" r="1.8"/><circle cx="856" cy="84" r="1.8"/></g>
    <rect x="152" y="53" width="720" height="22" fill="none" stroke="#1b1005" stroke-width="2"/>

    <!-- metal curls along the rims -->
    <use xlink:href="#rimCurls" transform="translate(236,44)"/>
    <use xlink:href="#rimCurls" transform="translate(788,44)"/>
    <use xlink:href="#rimCurls" transform="translate(236,84) scale(1,-1)"/>
    <use xlink:href="#rimCurls" transform="translate(788,84) scale(1,-1)"/>

    <!-- "Stamina" in Victorian script above the bar, with pen flourishes either side -->
    <use xlink:href="#flourish"/>
    <use xlink:href="#flourish" transform="translate(1024,0) scale(-1,1)"/>
    <text x="512" y="38" text-anchor="middle" font-family="Pinyon Script" font-size="44"
      fill="url(#brassText)" stroke="#2a1806" stroke-width="1.2" paint-order="stroke">Stamina</text>

    <!-- bottom centre: small oval cartouche with flourishes -->
    <use xlink:href="#flourishLow"/>
    <use xlink:href="#flourishLow" transform="translate(1024,0) scale(-1,1)"/>
    <ellipse cx="512" cy="88" rx="11" ry="7" fill="url(#brass)" stroke="#2a1806" stroke-width="1.4"/>
    <circle cx="512" cy="88" r="2.6" fill="url(#ball)" stroke="#2a1806" stroke-width="0.8"/>

    <use xlink:href="#end"/>
    <use xlink:href="#end" transform="translate(1024,0) scale(-1,1)"/>
  </g>
</svg>
</body></html>
